services:
  app:
    image: ghcr.io/gsync/jobsync:latest
    container_name: jobsync_app
    ports:
      - "3737:3737"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      # --- Toka Auth / Clerk (replaces next-auth) ---
      # NOTE: NEXT_PUBLIC_* are inlined at BUILD time by Next.js. Setting them
      # here only reaches server-side code; a prebuilt image needs the
      # publishable key baked in at build time, or the browser bundle will not
      # have it.
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_CLERK_SIGN_IN_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_URL}
      - CLERK_JWT_KEY=${CLERK_JWT_KEY:-}
      - TOKA_ROOT_DOMAIN=${TOKA_ROOT_DOMAIN:-tokadream.com}
      - TOKA_AUTH_SUBDOMAIN=${TOKA_AUTH_SUBDOMAIN:-accounts}
      - TOKA_APPS=${TOKA_APPS:-easyjobs}
      - TOKA_APP_DOMAINS=${TOKA_APP_DOMAINS:-}
      - TZ=${TZ:-America/Edmonton}
      - LAVINMQ_URL=${LAVINMQ_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3737"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: jobsync_worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - LAVINMQ_URL=${LAVINMQ_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
